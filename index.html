<!DOCTYPE html>
<html>
<head>
    <title>JS Racing Game</title>
    <style>
        body { margin: 0; background: #333; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: white; font-family: sans-serif; }
        canvas { background: #555; border: 4px solid #fff; }
        #ui { position: absolute; top: 20px; left: 20px; }
    </style>
</head>
<body>
    <div id="ui">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        // Game Constants
        const carWidth = 40;
        const carHeight = 70;
        
        let score = 0;
        let gameActive = true;
        let player = { x: 180, y: 500, speed: 5 };
        let enemies = [];
        let frames = 0;

        // Input handling
        let keys = {};
        window.addEventListener("keydown", (e) => keys[e.code] = true);
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        function spawnEnemy() {
            const lane = Math.floor(Math.random() * 3); // 3 lanes
            enemies.push({
                x: lane * 133 + 45,
                y: -100,
                speed: 3 + (score / 10) // Gets harder
            });
        }

        function update() {
            if (!gameActive) return;

            // Move Player
            if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
            if (keys["ArrowRight"] && player.x < canvas.width - carWidth) player.x += player.speed;

            // Move Enemies
            enemies.forEach((enemy, index) => {
                enemy.y += enemy.speed;

                // Collision detection
                if (player.x < enemy.x + carWidth &&
                    player.x + carWidth > enemy.x &&
                    player.y < enemy.y + carHeight &&
                    player.y + carHeight > enemy.y) {
                    gameActive = false;
                    alert("Game Over! Score: " + score);
                    location.reload();
                }

                // Remove off-screen enemies and score
                if (enemy.y > canvas.height) {
                    enemies.splice(index, 1);
                    score++;
                    scoreElement.innerText = score;
                }
            });

            if (frames % 100 === 0) spawnEnemy();
            frames++;
        }

        function draw() {
            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Road Lines
            ctx.strokeStyle = "white";
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            ctx.moveTo(133, 0); ctx.lineTo(133, 600);
            ctx.moveTo(266, 0); ctx.lineTo(266, 600);
            ctx.stroke();

            // Draw Player
            ctx.fillStyle = "cyan";
            ctx.fillRect(player.x, player.y, carWidth, carHeight);

            // Draw Enemies
            ctx.fillStyle = "red";
            enemies.forEach(enemy => {
                ctx.fillRect(enemy.x, enemy.y, carWidth, carHeight);
            });

            update();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
